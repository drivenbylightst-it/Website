{{- define "main" -}}
<script>
  document.documentElement.classList.add('dbl-is-home');
  document.documentElement.classList.add('dbl-is-page');
</script>
<style>
  .main{max-width:none!important;padding:0!important}

  .dbl-page{
    --dbl-bg:#0e0f12;
    --dbl-text:rgba(255,255,255,.92);
    --dbl-muted:rgba(255,255,255,.72);
    background:var(--dbl-bg);
    color:var(--dbl-text);
  }

  .dbl-is-page .dbl-nav{
    padding-top:22px!important;
  }

  .dbl-page .dbl-hero{
    min-height:490px;
    height:clamp(490px,62vh,680px);
    background-size:135%;
    background-position:50% 38%;
  }

  .dbl-page .dbl-hero__overlay{
    background:linear-gradient(180deg,rgba(0,0,0,.52),rgba(0,0,0,.42));
  }

  .dbl-page .dbl-hero__subtitle{
    margin-top:10px;
    color:var(--dbl-muted);
  }

  .dbl-page .dbl-section{
    padding:86px 0;
  }

  .dbl-page .dbl-container{
    width:min(1600px,calc(100% - 48px));
    margin:0 auto;
  }

  .dbl-page .dbl-text{
    color:var(--dbl-text);
  }

  .dbl-page .dbl-text a{
    color:#fff;
  }
</style>

<link rel="preload" as="image" href="{{ .Params.heroImage | default "/images/home/hero.jpg" }}">

<main class="dbl-page">

  <section class="dbl-hero dbl-hero--compact" style="--dbl-hero-img: url('{{ .Params.heroImage | default "/images/home/hero.jpg" }}');">
    <img
      src="/images/home/hero.jpg"
      alt="Driven By Light – fotografia e video automotive a Milano e Torino"
      class="dbl-hero__img-seo"
      loading="eager"
      fetchpriority="high"
      decoding="async"
    />
    <div class="dbl-hero__overlay"></div>
    <div class="dbl-hero__inner">
      <h1 class="dbl-hero__title">{{ .Title }}</h1>
      <p class="dbl-hero__subtitle">{{ .Params.heroSubtitle | default "Driven By Light" }}</p>
    </div>
  </section>

  <section class="dbl-section">
    <div class="dbl-container">
      <article class="dbl-text">
        {{ .Content }}
      </article>
    </div>
  </section>

</main>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  function initDblContactForm() {
    var form = document.getElementById("dbl-contact-form");
    if (!form) return;

    var statusEl = document.getElementById("dbl-contact-status");
    var submitBtn = form.querySelector('button[type="submit"]');
    var publicKey = form.dataset.emailjsPublicKey;
    var serviceId = form.dataset.emailjsServiceId;
    var templateId = form.dataset.emailjsTemplateId;

    function setStatus(message) {
      if (!statusEl) return;
      statusEl.textContent = message;
      statusEl.style.textAlign = "center";
      statusEl.style.fontWeight = "700";
      statusEl.style.display = "block";
      statusEl.style.width = "100%";
    }

    if (!window.emailjs) {
      setStatus("EmailJS non caricato. Disattiva eventuali blocker e ricarica la pagina.");
      return;
    }

    if (!publicKey || !serviceId || !templateId ||
        publicKey.indexOf("YOUR_") === 0 ||
        serviceId.indexOf("YOUR_") === 0 ||
        templateId.indexOf("YOUR_") === 0) {
      setStatus("Configura prima EmailJS (public key, service id, template id).");
      return;
    }

    emailjs.init({ publicKey: publicKey });

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      if (submitBtn) submitBtn.disabled = true;
      setStatus("Invio in corso...");

      var formData = new FormData(form);
      var templateParams = Object.fromEntries(formData.entries());
      var emailValue = templateParams.reply_to || templateParams.from_email || templateParams.email || "";
      var nameValue = templateParams.from_name || templateParams.name || "";

      if (emailValue) {
        templateParams.reply_to = emailValue;
        templateParams.from_email = emailValue;
        templateParams.email = emailValue;
      }
      if (nameValue) {
        templateParams.from_name = nameValue;
        templateParams.name = nameValue;
      }
      if (!templateParams.subject) {
        templateParams.subject = "Nuova richiesta dal sito Driven By Light";
      }

      emailjs.send(serviceId, templateId, templateParams)
        .then(function () {
          form.reset();
          setStatus("Messaggio inviato con successo.");
        })
        .catch(function (error) {
          console.error("EmailJS error:", error);
          var errorText = (error && (error.text || error.message || error.status)) || "errore sconosciuto";
          setStatus("Invio non riuscito: " + errorText + ".");
        })
        .finally(function () {
          if (submitBtn) submitBtn.disabled = false;
        });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initDblContactForm);
  } else {
    initDblContactForm();
  }
</script>
{{- end -}}
